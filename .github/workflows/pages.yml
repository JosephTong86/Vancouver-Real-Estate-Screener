name: Build screener and publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"   # weekly refresh, Mondays 09:17 UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests shapely
      - name: Download City of Vancouver open data
        run: python fetch_data.py
      - name: Score every Vancouver parcel
        run: python score.py
      - name: Download inner-ring municipal data (Burnaby, Richmond, New Westminster, North Vancouver City & District)
        continue-on-error: true
        run: python fetch_metro.py
      - name: Score the inner-ring municipalities
        continue-on-error: true
        run: python score_metro.py
      - name: Vendor Leaflet (inlined into the dashboard so the page has no runtime CDN dependency)
        continue-on-error: true
        run: |
          mkdir -p vendor
          curl -fsSL -o vendor/leaflet.js https://unpkg.com/leaflet@1.9.4/dist/leaflet.js
          curl -fsSL -o vendor/leaflet.css https://unpkg.com/leaflet@1.9.4/dist/leaflet.css
      - name: Build the dashboard and municipality comparison
        run: |
          python build_dashboard.py
          python gva_compare.py
          python - <<'EOF'
          import json, datetime, shutil, os, glob
          os.makedirs("site/metro", exist_ok=True)
          d = json.load(open("output/gva_compare.json"))
          d["generated"] = datetime.date.today().strftime("%B %d, %Y")
          t = open("gva_template.html", encoding="utf-8").read()
          open("site/gva_compare.html", "w", encoding="utf-8").write(t.replace("/*__DATA__*/", "const DATA=" + json.dumps(d, separators=(",", ":")) + ";"))
          shutil.copy("output/dashboard.html", "site/index.html")
          shutil.copy("output/dashboard.html", "site/dashboard.html")
          for f in ("top100.csv", "top100.json", "summary.json"):
              shutil.copy(os.path.join("output", f), os.path.join("site", f))
          if os.path.exists("output/metro_summary.json"):
              shutil.copy("output/metro_summary.json", "site/metro/summary.json")
          for f in glob.glob("output/metro/*_top100.csv"):
              shutil.copy(f, os.path.join("site/metro", os.path.basename(f)))
          open("site/.nojekyll", "w").close()
          EOF
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
